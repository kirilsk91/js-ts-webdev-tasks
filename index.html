<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAA/4QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAERERERERERERAAAAAAAAERAQAAAAAAEBEAEAAAAAEAEQABAAAAEAARAAAQAAEAABEAAAEAEAAAEQAAABEAAAARAAAAEQAAABEAAAEAEAAAEQAAEAABAAARAAEAAAAQABEAEAAAAAEAEQEAAAAAABAREAAAAAAAAREREREREREREAAAAAP/wAAF/6AABv9gAAd+4AAHveAAB9vgAAfn4AAH5+AAB9vgAAe94AAHfuAABv9gAAX/oAAD/8AAAAAAAA"

      type="image/x-icon"

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <header class="mb-2">
        <div>
          <div class="theme-switch">
            <label class="switch">
              <input type="checkbox" id="theme-toggle" />
              <span class="slider-box"></span>
            </label>
          </div>
        </div>
        <div class="col-9">
          <div id="counter" class="item-counter">6 items</div>
          <div class="item-filter">
            <span>Sort by <span id="selected-filter">Popular</span></span>
            <i class="fa-solid fa-chevron-down"></i>
            <ul class="dropdown-menu"></ul>
          </div>
        </div>
      </header>
      <main>
        <div id="nav-item-categories" class="item-categories col-3"></div>
        <div id="item-list" class="col-9"></div>
        <div id="no-items-container" class="col-9"></div>
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>
